<div class="erp-card">

```
<form method="POST">

    <!-- Customer Selection -->
    <div class="mb-3">

        <label class="form-label">
            Select Customer
        </label>

        <select
            class="form-control"
            name="customer_id"
            id="customer_id"
            required
            onchange="loadCustomerDue()"
        >

            <option value="">
                -- Select Customer --
            </option>

            {% for customer in customers %}

            <option value="{{ customer.id }}">
                {{ customer.name }} - {{ customer.mobile }}
            </option>

            {% endfor %}

        </select>

    </div>


    <!-- Customer Due Summary -->
    <div
        class="mb-4"
        id="due_section"
        style="display: none;"
    >

        <h5 class="fw-bold mb-3">
            Customer Due Summary
        </h5>

        <table class="table table-bordered">

            <thead>

                <tr>
                    <th>Installment</th>
                    <th>Due Month</th>
                    <th>Due Amount</th>
                </tr>

            </thead>

            <tbody id="due_table">

            </tbody>

        </table>

        <div class="mt-3">

            <h5 class="fw-bold">
                Total Due:
                ₹<span id="total_due">0.00</span>
            </h5>

        </div>

    </div>


    <!-- Amount Received -->
    <div class="mb-3">

        <label class="form-label">
            Amount Received
        </label>

        <input
            type="number"
            step="0.01"
            min="0.01"
            class="form-control"
            name="amount"
            id="amount"
            required
        >

    </div>


    <!-- Payment Date -->
    <div class="mb-3">

        <label class="form-label">
            Payment Date
        </label>

        <input
            type="date"
            class="form-control"
            name="payment_date"
            id="payment_date"
            required
        >

    </div>


    <!-- Payment Method -->
    <div class="mb-3">

        <label class="form-label">
            Payment Type
        </label>

        <select
            class="form-control"
            name="payment_method"
            required
        >

            <option value="">
                Select Method
            </option>

            <option value="CASH">
                Cash
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="BANK">
                Bank Transfer
            </option>

            <option value="CHEQUE">
                Cheque
            </option>

        </select>

    </div>


    <!-- Transaction Reference -->
    <div class="mb-3">

        <label class="form-label">
            Transaction Reference
        </label>

        <input
            type="text"
            class="form-control"
            name="transaction_reference"
        >

    </div>


    <!-- Notes -->
    <div class="mb-3">

        <label class="form-label">
            Notes
        </label>

        <textarea
            class="form-control"
            name="notes"
            rows="3"
        ></textarea>

    </div>


    <div class="d-flex justify-content-end">

        <button
            type="submit"
            class="btn btn-primary"
        >
            Record Payment
        </button>

    </div>

</form>
```

</div>

<script>

function loadCustomerDue() {

    const customerId =
        document.getElementById("customer_id").value;

    const dueSection =
        document.getElementById("due_section");

    const dueTable =
        document.getElementById("due_table");

    const totalDue =
        document.getElementById("total_due");


    // Reset
    dueTable.innerHTML = "";
    totalDue.innerHTML = "0.00";
    dueSection.style.display = "none";


    if (!customerId) {
        return;
    }


    fetch(
        `/payments/customer/${customerId}/due`
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "Unable to load customer due"
            );

        }

        return response.json();

    })

    .then(function(data) {

        console.log(
            "Customer Due:",
            data
        );


        if (
            !data.installments ||
            data.installments.length === 0
        ) {

            dueTable.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center">
                        No dues for this customer.
                    </td>
                </tr>
            `;

            totalDue.innerHTML = "0.00";

            dueSection.style.display = "block";

            return;
        }


        data.installments.forEach(
            function(item) {

                let dueMonth = "";

                if (item.due_month) {

                    const date =
                        new Date(item.due_month);

                    dueMonth =
                        date.toLocaleDateString(
                            "en-IN",
                            {
                                month: "short",
                                year: "numeric"
                            }
                        );

                }


                let row = `
                    <tr>

                        <td>
                            Installment
                            ${item.installment_number}
                        </td>

                        <td>
                            ${dueMonth}
                        </td>

                        <td>
                            ₹${Number(
                                item.due_amount
                            ).toFixed(2)}
                        </td>

                    </tr>
                `;


                dueTable.innerHTML += row;

            }
        );


        totalDue.innerHTML =
            Number(
                data.total_due || 0
            ).toFixed(2);


        dueSection.style.display = "block";

    })

    .catch(function(error) {

        console.error(
            "Customer due error:",
            error
        );


        dueTable.innerHTML = `
            <tr>
                <td colspan="3"
                    class="text-danger text-center">
                    Unable to load customer due.
                </td>
            </tr>
        `;

        totalDue.innerHTML = "0.00";

        dueSection.style.display = "block";

    });

}

</script>

{% endblock %}

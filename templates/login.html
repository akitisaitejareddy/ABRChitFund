<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Login | ABR Chit Fund ERP
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body {

            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0d6efd,
                #6610f2
            );

            display: flex;
            align-items: center;
            justify-content: center;

        }


        .login-card {

            width: 420px;
            border-radius: 15px;

        }


        .logo-circle {

            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: #0d6efd;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            font-weight: bold;

            margin: auto;

        }


    </style>


</head>


<body>


<div class="card shadow-lg border-0 login-card">


    <div class="card-body p-5">


        <div class="text-center">


            <div class="logo-circle mb-3">

                ABR

            </div>


            <h2 class="fw-bold mb-1">

                ABR Chit Fund

            </h2>


            <p class="text-muted mb-4">

                ERP Management System

            </p>


        </div>



        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <form method="POST"
              action="{{ url_for('auth.login') }}">


            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>


                <input 
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>



            <div class="mb-4">


                <label class="form-label">

                    Password

                </label>


                <input 
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>


            </div>



            <button type="submit"
                    class="btn btn-primary w-100 py-2">


                Login


            </button>


        </form>


    </div>


</div>


</body>

</html>
